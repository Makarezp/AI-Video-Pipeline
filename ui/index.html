<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGO - Video Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>🗑️ → ✨ GIGO</h1>
            <p class="tagline">AI Vid Editor</p>
        </header>

        <main class="main">
            <!-- Upload Section -->
            <section class="upload-section" id="uploadSection">
                <h2>Upload a Video</h2>
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📁</div>
                    <p>Drag & drop a video here, or click to select</p>
                    <p class="upload-hint">Supports .mp4, .mov, .webm</p>
                    <input type="file" id="fileInput" accept=".mp4,.mov,.webm" hidden>
                </div>
                <div class="upload-progress" id="uploadProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p id="uploadStatus">Uploading...</p>
                </div>
            </section>

            <!-- Video Selector -->
            <section class="video-selector" id="videoSelector">
                <h2>Or Select an Existing Video</h2>
                <div class="video-list" id="videoList">
                    <p class="loading">Loading videos...</p>
                </div>
            </section>

            <!-- Editor Panel (hidden until video selected) -->
            <section class="editor" id="editor" style="display: none;">
                <div class="video-container">
                    <video id="videoPlayer" controls>
                        <source src="" type="video/mp4">
                    </video>
                </div>

                <div class="timeline-container">
                    <div class="timeline-header">
                        <h3>Timeline</h3>
                        <div class="timeline-legend">
                            <span class="legend-item legend-keep">Keep</span>
                            <span class="legend-item legend-remove">Remove</span>
                        </div>
                    </div>
                    <div class="timeline-wrapper">
                        <div class="timeline" id="timeline"></div>
                        <div class="playhead" id="playhead"></div>
                    </div>
                    <div class="timeline-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>

                <div class="segment-info" id="segmentInfo">
                    <p class="segment-info-placeholder">Hover over a segment to see details</p>
                </div>

                <div class="actions">
                    <button class="btn btn-secondary" id="backBtn">← Back</button>
                    <button class="btn btn-secondary" id="resetBtn">Reset to AI</button>
                    <button class="btn btn-primary" id="renderBtn">
                        <span class="btn-icon">🎬</span>
                        Render Video
                    </button>
                </div>
            </section>

            <!-- Output Video Section (after render) -->
            <section class="output-section" id="outputSection" style="display: none;">
                <h2>✅ Edited Video Ready!</h2>
                <div class="video-container">
                    <video id="outputPlayer" controls></video>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" id="editAgainBtn">← Edit Again</button>
                    <a class="btn btn-primary" id="downloadBtn" download>
                        <span class="btn-icon">⬇️</span>
                        Download
                    </a>
                </div>
            </section>

            <!-- Status Messages -->
            <div class="status" id="status"></div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
